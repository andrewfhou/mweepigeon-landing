# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: hidden dovecote
author:
  name: mweepigeon
  email: mweepigeon@gmail.com

description: >- # this means to ignore newlines until "baseurl:"
  hi! you can call me mweep, or pigeon ^^ I'm a birb/derg thing, and I use
  they/them pronouns. I talk about magic, pens, furry stuff, SFF, and whatever
  else catches my fancy at the moment

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://mweepigeon.gay" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
remote_theme: "jekyll/minima@acb0519"
plugins:
  - jekyll-feed
  - jekyll-remote-theme

header_pages:
  - tags.html
  - about.md

permalink: pretty

minima:
  skin: dark
  date_format: "%Y-%m-%d"
  social_links:
   - title: Discord @mweepigeon
      icon: discord
      url: "https://discordapp.com/users/mweepigeon"
    - title: Telegram @mweepigeon
      icon: telegram
      url: "https://t.me/mweepigeon"
    - title: Signal @mweepigeon.3621
      icon: signal-messenger
      url: "https://signal.me/#eu/795NMlfGpC9Wi4srAl-Pt3yG5lD46CEs0oB1DGNwpQ33P7qeUFBB1JNY1BZ9bsLS"
    - title: Bluesky @mweepigeon.gay
      icon: bluesky
      url: "https://bsky.app/profile/mweepigeon.gay"
    - title: Mastodon @mweepigeon@meow.social
      icon: mastodon
      url: "https://meow.social/@mweepigeon"

# jekyll-feed config variables
feed:
  title: hidden dovecote
  description: mweep's blog about magic, pens, furry stuff, SFF, and whatever catches their fancy at the moment
  url: "https://mweepigeon.gay"
  icon: /assets/images/favicon-96x96.png

